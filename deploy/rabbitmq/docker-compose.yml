name: ${COMPOSE_PROJECT_NAME:-cwi-rabbitmq}

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-cwi-rabbitmq}
    hostname: ${RABBITMQ_HOSTNAME:-cwi-rabbitmq}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-cwi_vhost}
    volumes:
      - data:/var/lib/rabbitmq
    networks:
      - cwi-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
    name: ${RABBITMQ_VOLUME_NAME:-cwi-rabbitmq-data}

networks:
  cwi-rabbitmq:
    name: ${RABBITMQ_NETWORK_NAME:-cwi-rabbitmq-network}
