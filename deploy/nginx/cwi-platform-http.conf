upstream cwi_public {
    # The active release uses 8180. The backup removes downtime while the
    # first artifact release moves the legacy router away from public :8080.
    server 127.0.0.1:8180 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8080 backup;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    server_name ceo-workforce-index.com www.ceo-workforce-index.com;
    server_tokens off;
    client_max_body_size 20m;

    # A direct-origin request cannot use a forged CF-Connecting-IP header.
    if ($cwi_from_trusted_proxy = 0) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cwi-acme;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://cwi_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cwi_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
