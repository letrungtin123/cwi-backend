# Install this only after Certbot has created the certificate paths below.
server {
    listen 443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    server_name ceo-workforce-index.com www.ceo-workforce-index.com;
    server_tokens off;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/ceo-workforce-index.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceo-workforce-index.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    if ($cwi_from_trusted_proxy = 0) { return 444; }

    location / {
        proxy_pass http://cwi_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cwi_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
